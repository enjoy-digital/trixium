# SQRL ForestKitten 33 (xcvu33p) via the onboard FT2232 (micro-USB).
#
# The part is monolithic (single SLR): irlen 6, USER1=0x02, USER2=0x03, per
# $XILINX_VIVADO/data/parts/xilinx/virtexuplusHBM/public/bsdl/xcvu33p_fsvh2104.bsd.
# IDCODE 0x04b69093 is the non-CIV variant (the _CIV part reads 0x04b6d093).
#
# openocd 0.11 syntax (0.12 renamed these to 'adapter driver' / 'adapter speed').
interface ftdi
ftdi_vid_pid 0x0403 0x6010
ftdi_channel 0
ftdi_layout_init 0x00e8 0x60eb
reset_config none
adapter_khz 5000

# LiteX's jtagstream script refers to $_CHIPNAME.tap, so the variable must exist.
set _CHIPNAME xcvu33p
jtag newtap $_CHIPNAME tap -irlen 6 -expected-id 0x04b69093

# Debug aid: append '-ircapture 0x00 -irmask 0x3f' above to make openocd print the real IR
# capture value. 0x35 = DONE+INIT+ISC_DONE (configured), 0x11 = cleared and idle, 0x01 = mid-init.
