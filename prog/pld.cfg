# Bitstream loading for the FK33.
#
# openFPGALoader reports "done 1" on this board without configuring it: its JPROGRAM restarts
# the master-SPI boot and the factory flash image wins the race, so the DONE it reports is that
# image's (a bitstream with bytes corrupted mid-body still "succeeds"). openocd's virtex2 pld
# driver - the CFG_IN/JSTART opcodes are the same on UltraScale+ - loads it correctly, ~34 s.
#
#   openocd -f prog/openocd_fk33.cfg -f prog/pld.cfg \
#           -c "pld load 0 prog/bitstreams/trixium_b_n8_200MHz.bit" -c shutdown
pld device virtex2 xcvu33p.tap 1
init
