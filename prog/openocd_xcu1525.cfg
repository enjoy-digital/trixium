# SQRL XCU1525 (xcvu9p-fsgd2104, three SLRs) over an FT2232-class JTAG cable.
#
# Confirmed on the board 2026-09-19: the on-board FT4232H (0403:6011, "Xilinx CB-U1"),
# channel A, plain MPSSE layout; the tap answers 0x14b31093. USED FOR THE CHAIN STATE ONLY:
# programming goes through openFPGALoader (-c ft4232 --fpga-part xcvu9p), because openocd
# 0.11's virtex2 pld driver drives a single 6-bit IR and leaves this three-SLR device
# unconfigured (IR capture 0x11 per SLR) while reporting "loaded". Configured reads
# 0x35d75 (0x35 = DONE+INIT+ISC_DONE in every SLR): add
#   -ircapture 0x00 -irmask 0x3ffff
# to the tap line and openocd prints the capture as an "error".
#
# The VU9P's JTAG instruction register is 18 bits (three 6-bit SLR registers chained):
# irlen 18. IDCODE from xcvu9p_fsgd2104.bsd, version nibble masked.
#
# openocd 0.11 syntax (0.12 renamed these to 'adapter driver' / 'adapter speed').
interface ftdi
ftdi_vid_pid 0x0403 0x6011
ftdi_channel 0
ftdi_layout_init 0x0008 0x000b
reset_config none
adapter_khz 5000

set _CHIPNAME xcvu9p
jtag newtap $_CHIPNAME tap -irlen 18 -expected-id 0x04b31093 -ignore-version
