# SQRL XCU1525 (xcvu9p-fsgd2104, three SLRs) over an FT2232-class JTAG cable.
#
# UNTESTED: written 2026-09-18 before the board was connected, from the VU9P's BSDL and the
# FK33's config. Things to confirm on the day: the adapter (the XCU1525 has a JTAG header, not
# an on-board FTDI like the FK33 - a Digilent HS2/HS3 or an FT2232H cable; vid/pid, channel
# and layout below are the FT2232H defaults), and whether openFPGALoader configures this
# board at all (on the FK33 it reports done=1 while the flash image wins: docs/bringup.md).
#
# The VU9P's JTAG instruction register is 18 bits (three 6-bit SLR registers chained):
# irlen 18. IDCODE from xcvu9p_fsgd2104.bsd, version nibble masked.
#
# openocd 0.11 syntax (0.12 renamed these to 'adapter driver' / 'adapter speed').
interface ftdi
ftdi_vid_pid 0x0403 0x6010
ftdi_channel 0
ftdi_layout_init 0x00e8 0x60eb
reset_config none
adapter_khz 5000

set _CHIPNAME xcvu9p
jtag newtap $_CHIPNAME tap -irlen 18 -expected-id 0x04b31093 -ignore-version
