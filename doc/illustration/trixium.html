<style>
/* Layout: one 16:9 stage, a thin transport under it. Single dark look: it is a film. */
:root{
  color-scheme:dark;
  --bg:#050908; --stage:#081010; --ink:#e7eee9; --mute:#8a9c96; --rule:#1d2b28;
  --teal:#35c2ae; --amber:#f0a23a;
  --display:"Archivo",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--display);margin:0;padding-inline:16px;padding-block:20px;display:grid;place-items:center}
.player{width:min(100%,calc((100vh - 110px) * 16 / 9));display:grid;gap:10px}
canvas#cv{width:100%;height:auto;aspect-ratio:16/9;display:block;background:var(--stage);border:1px solid var(--rule);border-radius:4px;cursor:pointer}
.bar{display:flex;align-items:center;gap:12px;font:600 13px var(--mono);color:var(--mute)}
.bar button{font:700 13px var(--mono);letter-spacing:.06em;background:var(--teal);color:#04100d;border:0;border-radius:3px;padding:8px 14px;cursor:pointer;min-width:92px}
.bar button:focus-visible,.bar input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.bar input[type=range]{flex:1;min-width:0;accent-color:var(--teal)}
.bar .tc{font-variant-numeric:tabular-nums;white-space:nowrap}
body.capture{padding:0;background:#000;display:block}
body.capture .bar{display:none}
body.capture .player{width:1920px;display:block}
body.capture canvas#cv{border:0;border-radius:0;width:1920px;height:1080px}
</style>

  g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';
  background(t);

  for(const [a,b,f] of SCENES)if(t>=a&&t<b){g.save();f(t);g.restore();}

// ------------------------------------------------------------------ player
const au=document.getElementById('au'), btn=document.getElementById('play'), seek=document.getElementById('seek'), tc=document.getElementById('tc');
const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${(s%60).toFixed(1).padStart(4,'0')}`;
let playing=false, t0=0, wall0=0, poster=3.6, ready=false;
function now(){return playing?(au.readyState>=2&&!au.paused?au.currentTime:t0+(performance.now()-wall0)/1000):poster;}
function tick(){
  const t=now();
  if(t>=DUR){stop();poster=DUR-0.01;}
  if(ready)renderAt(Math.min(t,DUR-0.01));
  seek.value=t; tc.textContent=`${fmt(Math.min(t,DUR))} / 02:11`;
  if(playing)requestAnimationFrame(tick);
}
function start(){
  if(poster>=DUR-0.05)poster=0;
  playing=true;t0=poster;wall0=performance.now();
  try{au.currentTime=poster;const p=au.play();if(p&&p.catch)p.catch(()=>{});}catch(e){}
  btn.textContent='❚❚ PAUSE';requestAnimationFrame(tick);
}
function stop(){poster=now();playing=false;try{au.pause();}catch(e){}btn.textContent='▶ PLAY';}
btn.onclick=()=>playing?stop():start();
cv.onclick=()=>playing?stop():start();
seek.oninput=()=>{const v=+seek.value;poster=v;t0=v;wall0=performance.now();try{au.currentTime=v;}catch(e){}if(!playing)tick();};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'&&e.target.tagName!=='BUTTON'){e.preventDefault();playing?stop():start();}});

  .then(()=>{makeSprites();for(const k in TP)delete TP[k];ready=true;tick();return true;});
