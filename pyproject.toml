[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "trixium"
version = "0.1.0"
description = "TriXium: PrismML Bonsai ternary LLMs on FPGAs (LiteX/Migen): gateware, firmware, model converter, host tools"
readme = "README.md"
license = {text = "BSD-2-Clause"}
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "tokenizers",
    "pyserial",
]

[project.optional-dependencies]
dev  = ["pytest", "huggingface_hub"]
# The gateware itself needs Migen/LiteX from the LiteX installer, not from PyPI.

[project.scripts]
trixium = "trixium.cli:main"

[tool.setuptools.packages.find]
include = ["trixium*"]
exclude = ["trixium.software*"]

[tool.setuptools.package-data]
trixium = ["software/lib/*.c", "software/lib/*.h"]
